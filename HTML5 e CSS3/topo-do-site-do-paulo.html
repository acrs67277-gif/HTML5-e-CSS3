<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criação de sites com HTML e CSS do Paulo</title>
    <style rel="stylesheet">
        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            font-size: 15px;
        }

        .tudo {
            width: 900px;
            margin: 0 auto;
        }

        header {
            background-color: #f2f2f2;
            padding: 20px;
        }

        hgroup {
            text-align: center;
        }

        hgroup > h1, h2 {
           color: #ff00dd;
        }

        nav > ul, a {
            background-color: #333;
            color: #fff;
            list-style: none;
            text-decoration: none;
            display: flex;
            justify-content: center;
            padding: 9px;
            box-sizing: border-box;
        }   

        nav >  ul, li, a.corrente:hover {
            background-color: #f2f2f2;
            color: #ff0000;
            padding: 9px;
        }

        .home {
            display:flex;
            gap: 10px;
        }

    </style>
</head>

    <div class="tudo">

        <hgroup>

            <h2>Site destinado a divulgar o trabalho de Paulo Silva na criação de sites</h2>
        </hgroup>
        <nav>
            <ul>
