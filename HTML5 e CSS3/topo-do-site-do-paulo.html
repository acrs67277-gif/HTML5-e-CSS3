<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../HTML5 e CSS3/css/normalize.css">
    <title>Criação de sites com HTML e CSS do Paulo</title>
    <style rel="stylesheet">
       html {
        box-sizing: border-box;
       }

       *, *::before, *::after {
        inherits: inherit;
        line-height: 1;
        padding: 1px 20px 10px 20px;
       }
       
       .clear {
        clear: both;
       }

       body {
        font: 18px/1.4 arial, sans-serif;
        background: #ddd;
        color: #333;
       }

       .tudo {
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
        background: #fff;
       }

       .topo {
        width: 100%;
        line-height: 1;
        padding: 1px 20px 10px 20px;
       }

       .topo h1 {
        font-size: 36px;
        margin: 4px 0 2px 0;
        text-align: right;
       }

       .topo a {
        color: #900;
        text-decoration: none;
       }

       .topo h2 {
        font-size: 27px;
        margin: 2px 0 4px 0;
        text-align: right;
       }

       nav > ul {
        width: 100%;
        background: rgb(153, 0, 0);
        margin: 5px 0 0 0;
        padding: 0;
       }

       nav {
        border-top: 1px solid #990000;
        width: 100%;
        width: calc(100% + 40px);
        margin-left: -60px;
       }

       .topo > ul, li {
        list-style: none;
        display: inline;
       }

       .topo > ul, li, a {
        float: left;
        text-decoration: none;
        text-transform: uppercase;
        text-align: center;
        border-right: 1px solid #fff;
        padding: 9px 10px;
        color: #fff;
        background: rgba(153, 0, 0, 0);
        font-size: 14px;
        font-weight: bold;
       }

       .topo > ul, li:last-child, a {
        border: none;
       }

       .topo > ul, li, a:hover, .home .corrente {
        color: #990000;
        background: rgb(225, 185, 185);
        transition: cubic-bezier(0.075, 0.82, 0.165, 1);
       }
    </style>
</head>
<body class="home">
    <div class="tudo">
    <header class="topo">
        <hgroup>
            <h1><a href="/">Site do Paulo</a></h1>
            <h2>Site destinado a divulgar o trabalho de Paulo Silva na criação de sites</h2>
        </hgroup>
        <nav>
            <ul>
                <li><a class="corrente" href="home.html">Home</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="artigos-html.html">HTML</a></li>
                <li><a href="artigos-css.html">CSS</a></li>
                <li><a href="contato.html">Contact</a></li>
                <div class="clear"></div>
            </ul>
        </nav>
    </header>
    </div>
    <footer class="rodape">
       
    </footer>
</body>
</html>
