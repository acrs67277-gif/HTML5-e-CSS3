<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criação de sites com HTML e CSS do Paulo</title>
    <style rel="stylesheet">
        body {
            font: 18px/1.4 arial, sans-serif;
            background: #ddd;
            color: #333;
        }

        .tudo {
            width: 100%;
            max-width: 960px;
            margin: auto;
            background: #fff;
        }

        .topo {
            width: 100%;
            line-height: 1;
            padding: 1px 20px 10px 20px;
        }

        .topo h1 {
            font-size: 36px;
            margin: 4px 0 2px 0;
            text-align: right;
        }

        .topo a {
            color: #900;
            text-decoration: none;
        }

        .topo h2 {
            font-size: 20px;
            margin: 2px 0 4px 0;
            text-align: right;
        }

        nav > ul {
            width: 100%;
            background: #900;
            margin: 0;
            padding: 0;
        }

        .topo ul li {
            list-style: none;
            display: inline;
        }

        .topo ul li a {
            float: left;
            text-decoration: none;
            text-transform: uppercase;
            text-align: center;
            border-right: 1px solid #fff;
            padding: 10px 20px;
            color: #fff;
            background: #900;
            font-size: 14px;
            font-weight: bold;
        }

        .topo ul li:last-child a {
            border: none;
        }

        .topo ul li a:hover {
            color: #900;
            background: #ccc;
        }
    </style>
</head>
<body class="home">
    <div class="tudo">
        <header>
        <hgroup>
            <h1><a href="/">Site do Paulo</a></h1>
            <h2>Site destinado a divulgar o trabalho de Paulo Silva na criação de sites</h2>
        </hgroup>
        <nav>
            <ul>
                <li><a class="corrente" href="home.html">Home</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="artigos-html.html">Artigos HTML</a></li>
                <li><a href="artigos-css.html">Artigos CSS</a></li>
                <li><a href="contato.html">Contact</a></li>
                <div class="clear"></div>
            </ul>
        </nav>
    </header>
    </div>
    <footer>
        <!-- Conteúdo do rodapé do site -->
    </footer>
</body>
</html>
